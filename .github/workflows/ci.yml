name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --workspace
      - run: cargo build --release -p jocky-agent
      - uses: actions/upload-artifact@v4
        with:
          name: jocky-linux-agent
          path: target/release/jocky-agent
      - run: cargo run -p jocky-cli -- run examples/mock_investigation.jky --mock
      - run: cargo run -p jocky-cli -- check examples/full_investigation.jky
      - run: cargo run -p jocky-cli -- run examples/hello.jky
      - run: cargo run -p jocky-cli -- check examples/stdlib_investigation.jky
      - run: cargo run -p jocky-cli -- run examples/stdlib_investigation.jky
      - run: cargo run -p jocky-cli -- run examples/deterministic.jky > /tmp/jocky-interpreted.json
      - run: cargo run -p jocky-cli -- build examples/deterministic.jky --output /tmp/jocky-native
      - run: /tmp/jocky-native > /tmp/jocky-native.json
      - run: python3 -c 'import json; a=json.load(open("/tmp/jocky-interpreted.json")); b=json.load(open("/tmp/jocky-native.json")); assert a["reports"][0]["evidence"] == b["reports"][0]["evidence"]'
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --workspace
      - run: cargo build --release -p jocky-agent
      - uses: actions/upload-artifact@v4
        with:
          name: jocky-windows-agent
          path: target/release/jocky-agent.exe
      - run: cargo run -p jocky-cli -- run examples/stdlib_investigation.jky
      - run: cargo run -p jocky-cli -- build examples/deterministic.jky --output "$env:RUNNER_TEMP\jocky-native.exe"
      - run: '& "$env:RUNNER_TEMP\jocky-native.exe"'
      - uses: actions/upload-artifact@v4
        with:
          name: jocky-cli-windows
          path: target/debug/jocky-cli.exe
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python ../scripts/detection_benchmark.py
      - run: python ../scripts/demo_e2e.py
  blockchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: blockchain
      - run: npm test
        working-directory: blockchain
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo build -p jocky-cli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          JOCKY_CLI: ${{ github.workspace }}/target/debug/jocky-cli
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: frontend/test-results
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - run: python tests/e2e/compose_smoke.py
      - if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down -v
